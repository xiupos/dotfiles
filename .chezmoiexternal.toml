# SKK 辞書
# → private_dot_local/private_share/fcitx5/skk/dictionary_list
[".local/share/fcitx5/skk/dict/SKK-JISYO.im@sparql.all.utf8"]
    type = "file"
    url = "https://github.com/banjun/skk-jisyo-imasparql/raw/refs/heads/m@ster/SKK-JISYO.im@sparql.all.utf8"
    refreshPeriod = "720h"
[".local/share/fcitx5/skk/dict/SKK-JISYO.emoji.utf8"]
    type = "file"
    url = "https://github.com/uasi/skk-emoji-jisyo/raw/refs/heads/master/SKK-JISYO.emoji.utf8"
    refreshPeriod = "720h"
[".local/share/fcitx5/skk/dict/SKK-JISYO.latex.unicode-math.utf8"]
    type = "file"
    url = "https://github.com/xiupos/skk-jisyo-latex-unicode-math/raw/refs/heads/master/SKK-JISYO.latex.unicode-math.utf8"
    refreshPeriod = "720h"

# pdfLaTeX (bxcjkjatype) 用の和文 TTF
# → private_dot_local/private_share/pandoc/includes/font-ja.sty
[".local/share/texmf/fonts/truetype/SourceHanSerifJP"]
    type = "archive"
    url = "https://github.com/Pal3love/Source-Han-TrueType/releases/download/2.005-2.003-1.002-R/SourceHanSerifJP.zip"
    include = ["SourceHanSerifJP-Regular.ttf", "SourceHanSerifJP-Medium.ttf"]
[".local/share/texmf/fonts/truetype/SourceHanSansJP"]
    type = "archive"
    url = "https://github.com/Pal3love/Source-Han-TrueType/releases/download/2.005-2.003-1.002-R/SourceHanSansJP.zip"
    include = ["SourceHanSansJP-Regular.ttf", "SourceHanSansJP-Medium.ttf"]

# Pandoc filters
# → private_dot_local/private_share/pandoc/defaults/common-base.yaml
[".local/share/pandoc/filters/include-files.lua"]
    type = "file"
    url = "https://raw.githubusercontent.com/pandoc-ext/include-files/refs/heads/main/include-files.lua"
    refreshPeriod = "720h"

# Juisee (Nerd Fonts)
# → private_dot_config/foot/foot.ini
[".local/share/fonts/Juisee"]
    type = "archive"
    url = "https://github.com/yuru7/juisee/releases/download/v0.2.0/Juisee_NF_v0.2.0.zip"
    stripComponents = 1
    include = ["*/*.ttf"]

# zsh plugin manager
# → dot_zshrc, dot_zsh_plugins.txt
[".local/share/antidote"]
    type = "git-repo"
    url = "https://github.com/mattmc3/antidote.git"
    refreshPeriod = "720h"
    clone.args = ["--depth=1"]
