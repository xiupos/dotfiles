standalone: true

from: markdown+raw_tex
to: latex
pdf-engine: pdflatex

variables:
  lang: en-GB
  classoption: [a4paper, 12pt]
  graphics: true
  linkcolor: blue
  indent: true

number-sections: true
shift-heading-level-by: -1
listings: true
metadata:
  cref: true

filters:
  - include-files.lua
  - tikz.lua  # before unicode-math.lua and pandoc-crossref
  - unicode-math.lua
  - pandoc-crossref
  - citeproc
  - fenced-divs.lua
  - url-encode.lua
  # - numbered.lua
  - dedupe-table-label.lua

csl: JHEP
