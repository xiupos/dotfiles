# Citations from the Refdir library ($REFDIR, else ~/Documents/Refdir): latexmk's
# bibtex step writes <job>-refdir.bib with what the document cites (see ~/.latexmkrc)
cite-method: natbib
pdf-engine: latexmk

variables:
  natbiboptions: "numbers,sort&compress"
  biblio-style: JHEP

include-after-body:
  - ${.}/../includes/refdir-bibliography.tex
